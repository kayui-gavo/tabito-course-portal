  <script>
    renderStudyLesson();
    (() => {
      const figures = document.querySelectorAll('.et-two-figures .et-bars');
      if (figures.length === 2) {
        const values = [1260, 1300, 1340, 1380, 1420];
        [...figures[0].children].forEach((bar, i) => { bar.style.height = `${Math.round(values[i] / 1450 * 90)}px`; });
        [...figures[1].children].forEach((bar, i) => { bar.style.height = `${Math.round((values[i] - 1200) / 250 * 90)}px`; });
      }
    })();
  </script>
  <script src="student-ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (document.querySelector('.et-route')) {
        document.querySelectorAll('.lesson-route').forEach(node => node.remove());
      }
    }, { once: true });
  </script>
