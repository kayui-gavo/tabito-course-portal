<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>電流がつくる磁界 · 旅人教育 物理Demo</title><link rel="stylesheet" href="../assets/physics-demo-lab-v2.css"><style>.screen canvas{height:500px}.hint{font-size:11px;color:var(--muted);margin-top:5px}</style></head><body><script>if(localStorage.getItem('physicsSiteAuth')!=='true')location.href='../login.html?subject=physics&next=resources/magnetic-field-demo.html'</script><header class="topbar"><div class="topbar-inner"><a class="brand" href="physics-demos.html"><img class="brand-logo" src="../assets/images/tabito-logo.jpg" alt="旅人教育"><span class="brand-copy"><strong>物理 Demo 集</strong><span>電磁気・磁界</span></span></a><div class="top-actions"><a class="btn secondary" href="physics-demos.html">Demo一覧</a><a class="btn" href="../physics.html">课程资料库</a></div></div></header><main class="page"><section class="intro"><div class="intro-main"><p class="eyebrow">電磁気・電流がつくる磁界</p><h1>導線のまわりで方位磁針を動かす</h1><p class="lead">直線電流の周囲に方位磁針を置き、位置を動かすと針が常に円周の接線方向を向く様子を確認できます。電流を反転すると磁界の向きも一斉に反転します。</p></div><aside class="intro-side"><strong>直線電流</strong><span class="formula">B∝I/r<small>向きは右ねじの法則</small></span></aside></section><section class="steps"><div class="step"><b>1　電流を流す</b><span>導線の周囲に同心円状の磁界ができます。</span></div><div class="step"><b>2　方位磁針をドラッグ</b><span>どこでも針は磁界の接線方向を向きます。</span></div><div class="step"><b>3　電流を反転</b><span>磁界の向きが逆転します。</span></div></section><section class="layout"><div class="screen"><canvas id="c" width="1000" height="620"></canvas></div><aside class="controls"><div class="control"><div class="seg"><button id="out" class="active">電流：手前向き</button><button id="into">電流：奥向き</button></div></div><div class="control"><label>電流 I <span class="value" id="it"></span></label><input id="I" type="range" min="0.5" max="5" step="0.1" value="2"></div><div class="control"><label>方位磁針の距離 r <span class="value" id="rt"></span></label><input id="r" type="range" min="70" max="240" step="5" value="150"></div><div class="control"><label>方位磁針の角位置 <span class="value" id="pt"></span></label><input id="phi" type="range" min="0" max="360" step="1" value="30"></div><div class="control"><div class="facts"><div class="fact"><span>磁界の強さ（相対）</span><strong id="bt"></strong></div><div class="fact"><span>磁界の向き</span><strong id="dir"></strong></div></div></div><div class="teacher-note">磁界の強さは導線から離れるほど弱くなります。針の赤側を N 極として描いています。</div></aside></section><div class="back-list"><a href="physics-demos.html">← Demo一覧へ戻る</a></div></main><script>const c=document.getElementById('c'),g=c.getContext('2d'),$=x=>document.getElementById(x),Is=$('I'),rs=$('r'),phis=$('phi');let sign=1;function set(s){sign=s;$('out').classList.toggle('active',s>0);$('into').classList.toggle('active',s<0)}$('out').onclick=()=>set(1);$('into').onclick=()=>set(-1);function arrowHead(x,y,a,col){g.fillStyle=col;g.beginPath();g.moveTo(x,y);g.lineTo(x-10*Math.cos(a-.45),y-10*Math.sin(a-.45));g.lineTo(x-10*Math.cos(a+.45),y-10*Math.sin(a+.45));g.closePath();g.fill()}function draw(){let I=+Is.value,R=+rs.value,phi=+phis.value*Math.PI/180,cx=500,cy=315;g.clearRect(0,0,c.width,c.height);g.fillStyle='#fbfcfd';g.fillRect(0,0,c.width,c.height);for(let rr=70;rr<=250;rr+=45){g.strokeStyle='rgba(46,113,151,.25)';g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,rr,0,Math.PI*2);g.stroke();for(let k=0;k<4;k++){let a=k*Math.PI/2+.2,x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a),t=a+sign*Math.PI/2;arrowHead(x,y,t,'rgba(46,113,151,.55)')}}g.fillStyle='#17324a';g.beginPath();g.arc(cx,cy,28,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.font='800 25px sans-serif';g.textAlign='center';g.fillText(sign>0?'•':'×',cx,cy+8);g.textAlign='left';g.fillStyle='#66727f';g.font='700 13px sans-serif';g.fillText(sign>0?'電流：画面の手前':'電流：画面の奥',438,360);let x=cx+R*Math.cos(phi),y=cy+R*Math.sin(phi),t=phi+sign*Math.PI/2;g.save();g.translate(x,y);g.rotate(t);g.strokeStyle='#263746';g.lineWidth=2;g.beginPath();g.arc(0,0,34,0,Math.PI*2);g.stroke();g.fillStyle='#a45050';g.beginPath();g.moveTo(30,0);g.lineTo(-4,-9);g.lineTo(-4,9);g.closePath();g.fill();g.fillStyle='#e0e5e9';g.beginPath();g.moveTo(-30,0);g.lineTo(4,-9);g.lineTo(4,9);g.closePath();g.fill();g.fillStyle='#a45050';g.font='800 12px sans-serif';g.fillText('N',10,-12);g.restore();g.setLineDash([4,5]);g.strokeStyle='#aeb8bf';g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke();g.setLineDash([]);let B=I/(R/100);$('it').textContent=I.toFixed(1)+' A';$('rt').textContent=(R/100).toFixed(2)+' (相対)';$('pt').textContent=(phi*180/Math.PI).toFixed(0)+'°';$('bt').textContent=B.toFixed(2);$('dir').textContent=sign>0?'反時計回り':'時計回り';requestAnimationFrame(draw)}set(1);requestAnimationFrame(draw)</script></body></html>
