    const topicKey = {
      waveform: 'waveform', sound: 'sound', optics: 'optics', thermal: 'thermalTopic', capacitor: 'capacitor',
      electric: 'electric', magnetic: 'magnetic', atomic: 'atomicTopic', motion: 'motion', energy: 'energy', orbit: 'orbit'
    };

    const select = document.getElementById('languageSelect');
    const savedLang = localStorage.getItem('physicsDemoLang') || 'ja';
    select.value = translations[savedLang] ? savedLang : 'ja';

    function t(key){return translations[select.value][key] || translations.ja[key] || key}
    function liveCount(domain){return demos[domain].filter((item)=>item.status==='live').length}
    function createCard(item){
      const tag = item.status === 'live' ? 'a' : 'article';
      const el = document.createElement(tag);
      el.className = item.status === 'live' ? 'demo-card' : 'empty-card';
      if(item.href) el.href = item.href;
      el.innerHTML = `
        <div class="chip-row">
          <span class="chip">${t(topicKey[item.topic])}</span>
          <span class="chip ${item.status === 'live' ? 'checked' : 'todo'}">${t(item.status === 'live' ? 'live' : 'todo')}</span>
        </div>
        <h3>${t(item.title)}</h3>
        <p>${t(item.desc)}</p>
      `;
      return el;
    }
    function render(){
      document.documentElement.lang = t('htmlLang');
      document.title = t('title');
      document.getElementById('brandText').textContent = t('brand');
      document.getElementById('backLink').textContent = t('back');
      document.getElementById('heroLabel').textContent = t('heroLabel');
      document.getElementById('heroTitle').textContent = t('heroTitle');
      document.getElementById('heroLead').textContent = t('heroLead');
      document.getElementById('statusPanel').setAttribute('aria-label', t('statusAria'));
      document.getElementById('statusPanel').innerHTML = `
        <div class="stat"><strong>8</strong><span>${t('liveCount')}</span></div>
        <div class="stat"><strong>5</strong><span>${t('domainCount')}</span></div>
        <p>${t('statusText')}</p>
      `;
      const nav = document.getElementById('domainNav');
      nav.setAttribute('aria-label', t('navAria'));
      nav.innerHTML = order.map((domain)=>`<a class="nav-chip" href="#${domain}">${t(domain)}</a>`).join('');
      const domains = document.getElementById('domains');
      domains.innerHTML = '';
      order.forEach((domain)=>{
        const section = document.createElement('section');
        section.className = 'domain';
        section.id = domain;
        const count = liveCount(domain);
        section.innerHTML = `
          <div class="domain-head">
            <div>
              <h2>${t(domain)}</h2>
              <p>${t(domain + 'Desc')}</p>
            </div>
            <span class="count">${count ? t('countLive')(count) : t('countTodo')}</span>
          </div>
          <div class="demo-grid"></div>
        `;
        const grid = section.querySelector('.demo-grid');
        demos[domain].forEach((item)=>grid.appendChild(createCard(item)));
        domains.appendChild(section);
      });
      localStorage.setItem('physicsDemoLang', select.value);
    }
    select.addEventListener('change', render);
    render();
  </script>
