name: Temporary lesson 04 review publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-publish-lesson04-review.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download lesson 04 review
        env:
          FILE_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-ffa4-8206-8782-25cc38af22ed/raw?se=2026-10-03T11%3A49%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=f858100e-fe3a-5e6b-81f0-befc0f083f17&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T05%3A37%3A10Z&ske=2026-10-04T05%3A37%3A10Z&sks=b&skv=2026-02-06&sig=mPmqH6jHKrer%2BEwmyk5azY59CExIBHhlGq3PerCq1CQ%3D'
        run: |
          set -euo pipefail
          mkdir -p course-notes/winter-2026
          curl -L --fail --retry 3 "$FILE_URL" -o course-notes/winter-2026/lesson-04-review.pdf
          test "$(stat -c%s course-notes/winter-2026/lesson-04-review.pdf)" -gt 200000
      - name: Commit lesson 04 review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-notes/winter-2026/lesson-04-review.pdf
          git commit -m "Add lesson 04 review handout"
          git push
