name: Temporary PDF publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-publish-energy-momentum.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF
        env:
          PDF_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-cf80-8206-b2be-6e9ca57fb641/raw?se=2026-10-01T09%3A27%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=bb9e65f7-8a0e-5be7-a3b0-41735324bd7a&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A57%3A00Z&ske=2026-10-02T06%3A57%3A00Z&sks=b&skv=2026-02-06&sig=MBm7khNFj8zDIcyVs6a1Q5rHYBesGjhaNwgVU8keRdg%3D'
        run: |
          set -euo pipefail
          mkdir -p course-notes/winter-2026
          curl -L --fail --retry 3 "$PDF_URL" -o course-notes/winter-2026/energy-momentum-practice.pdf
          test "$(stat -c%s course-notes/winter-2026/energy-momentum-practice.pdf)" -gt 100000
      - name: Commit PDF
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add course-notes/winter-2026/energy-momentum-practice.pdf
          git commit -m "Add energy and momentum practice set"
          git push
